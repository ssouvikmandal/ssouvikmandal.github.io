<!DOCTYPE html>
<html lang="{{language}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{{base}}<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="author" content="{{name}}">
{{robots}}<link rel="canonical" href="{{canonical}}">
<meta property="og:type" content="{{og_type}}">
<meta property="og:site_name" content="{{name}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{og_image}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{name}}">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="images/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<link rel="preload" href="assets/fonts/newcm-web-book.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/site.css">
{{head_extra}}</head>
<body>
<a class="skip" href="#content">Skip to main content</a>
<div class="page">
  <header class="site-header">
    <img class="motif" src="images/motif.svg" alt="" width="64" height="64">
    <div class="brand-text">
      <a class="name" href="index.html">{{name}}</a>
      <p class="affiliation">{{institution_logo}}<span class="aff-text"><span>{{position}},</span> <span>{{department}}, {{institution}}</span></span></p>
    </div>
  </header>
  <nav class="site-nav" aria-label="Main menu">
    <ul>
{{nav}}
    </ul>
  </nav>
  <main id="content">
{{content}}
  </main>
</div>
<footer class="site-footer">
  <p>{{name}} · Last updated <time datetime="{{updated_iso}}">{{updated}}</time></p>
</footer>
</body>
</html>
