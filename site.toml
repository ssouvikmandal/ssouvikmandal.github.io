# Everything that changes with a new job lives in this file. After editing it, run
#     python3 build.py
# to regenerate every page (see README.md).

[site]
# Full address of the published site, without a trailing slash. Only sitemap.xml,
# robots.txt, the 404 page and the tags for search engines and link previews use it;
# the pages link to each other with relative links, so they work anywhere. Change it
# when the site moves.
url = "https://ssouvikmandal.github.io"
# The year the site started: the footer shows "© 2026 Souvik Mandal", or "© 2026–2028"
# once a page has been updated in a later year.
since = 2026
# When the site was first published, as date, time and time zone ("Z" = UTC); for search
# engines (schema.org "dateCreated"). A plain date such as 2026-11-18 also works.
created = 2026-11-18T10:31:41Z
language = "en"

[person]
name = "Souvik Mandal"
# Shown under your name at the top of every page and used in the page descriptions.
position = "PhD Scholar"
department = "Department of Mathematics"
institution = "IIT Madras"
# Logo shown beside the affiliation line on every page; change it with the institution,
# or set it to "" for no logo.
institution_logo = "images/logo-iit-madras.png"
# Email addresses. Write " [at] " instead of "@": this file is public (in the repository
# and on the site), and the spelled-out form keeps the addresses away from programs that
# collect addresses for spam. build.py turns it back into "@".
# Main address: shown first on the Contact page and opened by the email icon at the top
# of every page.
email = "ssouvik.xyz [at] gmail.com"
# Further addresses shown on the Contact page, each as ["label", "address"].
other_emails = [["IIT Madras", "ma22d014 [at] smail.iitm.ac.in"]]
orcid = "https://orcid.org/0009-0004-0429-3063"
google_scholar = "https://scholar.google.com/citations?user=NDJZbpcAAAAJ"
# For search engines only: these go into the description of you that Google and other
# search engines read from the home page (schema.org; see README.md, "Search engines").
# They are not shown on the pages, so keep them in line with what the pages say.
institution_full_name = "Indian Institute of Technology Madras"
institution_url = "https://www.iitm.ac.in/"
department_url = "https://math.iitm.ac.in/"
research_areas = ["Topology", "Geometry"]
# Places you studied before, each as ["name", "web address"] (schema.org "alumniOf").
studied_at = [
  ["Indian Statistical Institute, Bengaluru", "https://www.isibang.ac.in/"],
  ["St. Xavier’s College, Kolkata", "https://sxccal.edu/"],
]
awards = ["Prime Minister’s Research Fellowship (PMRF), 9th cycle, 2022"]
# Postal address, one line per entry, as shown on the Contact page.
address = [
  "Souvik Mandal",
  "PhD Scholar, Department of Mathematics",
  "NAC-620, Indian Institute of Technology Madras",
  "Chennai 600036, India",
]
# The photo is always images/photo.jpg and the CV is always cv.pdf: to update them,
# replace those files (keep the names) and run python3 build.py.

[search]
# Proof of ownership for Google Search Console (see README.md, "Search engines").
# "HTML file" method (in use): the name of the file Google gives, e.g. "google1234abcd.html";
# build.py writes that file. Keep it: deleting it ends the verification.
google_verification_file = "google59317c9659984622.html"
# "HTML tag" method, for Google and for Bing Webmaster Tools: only the code from
# content="…" of the tag they show. Leave "" when not used.
google_site_verification = ""
bing_site_verification = ""

# The menu at the top of every page, in this order. Each entry is a page in
# source/pages/ that is published under the same file name.
[[nav]]
label = "Home"
file = "index.html"

[[nav]]
label = "Academic Details & CV"
file = "cv.html"

[[nav]]
label = "Research"
file = "research.html"

[[nav]]
label = "Publications"
file = "publications.html"

[[nav]]
label = "Achievements"
file = "achievements.html"

[[nav]]
label = "Teaching"
file = "teaching.html"

[[nav]]
label = "Conferences & Workshops"
file = "conferences.html"

[[nav]]
label = "Contact"
file = "contact.html"
